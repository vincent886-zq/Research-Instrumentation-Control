<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-label="电主轴 HMI · 启动请求与命令读回">
<rect width="1280" height="690" fill="#f5f8fc"/>
<text x="52" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" text-anchor="start" fill="#18324e" font-weight="700">电主轴 HMI · 启动请求与命令读回</text>
<text x="52" y="88" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">启动成功路径；停止与故障处理在下方另列说明</text>
<g data-node="1"><rect x="52" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="222.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">01 · 操作者启动请求</text>
<text x="222.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">REAL / TEST 后端分离</text>
<text x="222.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">设定转速与确认入口</text>
</g>
<g data-node="2"><rect x="470" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="640.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">02 · 启动前条件检查</text>
<text x="640.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连接 / 初始化 / 轮询新鲜度</text>
<text x="640.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">急停与实体停止输入</text>
</g>
<g data-node="3"><rect x="888" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1058.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">03 · 确认零命令输出</text>
<text x="1058.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">IO7 = 0 / DA0 ≈ 0</text>
<text x="1058.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">检查故障锁存与 STOP 抢占</text>
</g>
<g data-node="4"><rect x="888" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1058.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">04 · 转速给定</text>
<text x="1058.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">写 DA0</text>
<text x="1058.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连续读回 3 次确认</text>
</g>
<g data-node="5"><rect x="470" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="640.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">05 · 主轴 RUN 命令</text>
<text x="640.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">写 IO7 = 1</text>
<text x="640.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连续读回 3 次确认</text>
</g>
<g data-node="6"><rect x="52" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="222.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">06 · 软件状态更新</text>
<text x="222.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">进入 RUNNING</text>
<text x="222.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">异常进入停止 / 故障路径</text>
</g>
<g data-edge="1-2"><polyline points="400,205 451.0,205.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="462,205 451,200 451,210" fill="#526782"/></g>
<g data-edge="2-3"><polyline points="818,205 869.0,205.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="880,205 869,200 869,210" fill="#526782"/></g>
<g data-edge="3-4"><polyline points="1058,273 1058.0,361.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1058,372 1053,361 1063,361" fill="#526782"/></g>
<g data-edge="4-5"><polyline points="880,440 829.0,440.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="818,440 829,435 829,445" fill="#526782"/></g>
<g data-edge="5-6"><polyline points="462,440 411.0,440.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="400,440 411,435 411,445" fill="#526782"/></g>
<path d="M52 561 H1228" fill="none" stroke="#d6e0ed"/>
<text x="52" y="589" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">Stop 独立尝试撤销 RUN 与转速给定；故障锁存后需要恢复操作。</text>
<text x="52" y="618" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">IO7 / DA0 是控制器命令读回，不等同于主轴实际转速或转子零速反馈。</text>
</svg>