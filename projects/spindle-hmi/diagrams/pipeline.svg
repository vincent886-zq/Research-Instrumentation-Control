<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600"><rect width="1120" height="600" fill="#f5f8fc"/><text x="48" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" text-anchor="start" fill="#18324e" font-weight="700">电主轴 HMI · 启动请求与命令读回</text><text x="48" y="82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">PySide6 界面 / 主轴状态核心 / ZMotion ctypes 适配</text><rect x="48" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="200.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">操作者启动请求</text><text x="200.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">REAL / TEST 后端分离</text><text x="200.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">设定转速与确认入口</text><rect x="408" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="560.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">启动前条件检查</text><text x="560.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连接 / 初始化 / 轮询新鲜度</text><text x="560.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">急停与实体停止输入</text><rect x="768" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="920.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">确认零命令输出</text><text x="920.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">IO7 = 0 / DA0 ≈ 0</text><text x="920.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">检查故障锁存与 STOP 抢占</text><rect x="768" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="920.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">转速给定</text><text x="920.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">写 DA0</text><text x="920.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连续读回 3 次确认</text><rect x="408" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="560.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">主轴 RUN 命令</text><text x="560.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">写 IO7 = 1</text><text x="560.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连续读回 3 次确认</text><rect x="48" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="200.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">软件状态更新</text><text x="200.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">进入 RUNNING</text><text x="200.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">异常进入停止 / 故障路径</text><polyline points="352,190 403,190" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="403,190 393,185 393,195" fill="#526782"/><polyline points="712,190 763,190" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="763,190 753,185 753,195" fill="#526782"/><polyline points="920,245 920,330" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="920,330 915,320 925,320" fill="#526782"/><polyline points="768,390 717,390" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="717,390 727,385 727,395" fill="#526782"/><polyline points="408,390 357,390" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="357,390 367,385 367,395" fill="#526782"/><text x="48" y="510" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">Stop 独立尝试撤销 RUN 与转速给定；故障锁存后需要恢复操作。</text><text x="48" y="541" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">IO7 / DA0 是控制器命令读回，不等同于主轴实际转速或转子零速反馈。</text></svg>