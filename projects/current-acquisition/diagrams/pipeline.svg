<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600"><rect width="1120" height="600" fill="#f5f8fc"/><text x="48" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" text-anchor="start" fill="#18324e" font-weight="700">八路电流采集 · 电压到电流</text><text x="48" y="82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">HSTS016L 名义换算 + AD7606 原始码 + 逐通道零点管理</text><rect x="48" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="200.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">传感器与采集板</text><text x="200.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">8 路模拟量 / int16</text><text x="200.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">AD7606 + STM32F407</text><rect x="408" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="560.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">18 字节二进制帧</text><text x="560.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">0xAA + 8 × int16 + seq</text><text x="560.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">0xBB：八路零点校准结果</text><rect x="768" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="920.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">接收与换算</text><text x="920.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">电压 V = raw × 5 / 32768</text><text x="920.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">名义电流 I = (V − 2.5) × 16</text><rect x="768" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="920.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">批量更新</text><text x="920.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">8 通道 × 电压 / 电流</text><text x="920.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">独立通道选择与波形显示</text><rect x="408" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="560.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">校准配置管理</text><text x="560.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">保存 / 加载 .cal 文件</text><text x="560.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">每通道独立零点偏移</text><rect x="48" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="200.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">缓存与 CSV 保存</text><text x="200.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">17 列：时间 + 8 组 V / I</text><text x="200.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">实时存盘 / 手动导出</text><polyline points="352,190 403,190" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="403,190 393,185 393,195" fill="#526782"/><polyline points="712,190 763,190" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="763,190 753,185 753,195" fill="#526782"/><polyline points="920,245 920,330" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="920,330 915,320 925,320" fill="#526782"/><polyline points="768,390 717,390" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="717,390 727,385 727,395" fill="#526782"/><polyline points="408,390 357,390" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="357,390 367,385 367,395" fill="#526782"/><text x="48" y="510" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">与六路位移版协议不同：当前电流帧没有 CRC 字段，不混用解析器。</text><text x="48" y="541" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">名义灵敏度来自程序配置；测量准确度应由实际传感器与校准结果确定。</text></svg>