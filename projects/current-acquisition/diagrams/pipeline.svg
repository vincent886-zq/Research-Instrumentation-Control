<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-label="八路电流采集 · 电压到电流">
<rect width="1280" height="690" fill="#f5f8fc"/>
<text x="52" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" text-anchor="start" fill="#18324e" font-weight="700">八路电流采集 · 电压到电流</text>
<text x="52" y="88" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">HSTS016L 名义换算 + AD7606 原始码 + 逐通道零点管理</text>
<g data-node="1"><rect x="52" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="222.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">01 · 传感器与采集板</text>
<text x="222.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">8 路模拟量 / int16</text>
<text x="222.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">AD7606 + STM32F407</text>
</g>
<g data-node="2"><rect x="470" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="640.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">02 · 18 字节二进制帧</text>
<text x="640.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">0xAA + 8 × int16 + seq</text>
<text x="640.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">0xBB：八路零点校准结果</text>
</g>
<g data-node="3"><rect x="888" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1058.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">03 · 接收与换算</text>
<text x="1058.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">电压 V = raw × 5 / 32768</text>
<text x="1058.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">名义电流 I = (V − 2.5) × 16</text>
</g>
<g data-node="4"><rect x="888" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1058.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">04 · 批量更新</text>
<text x="1058.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">8 通道 × 电压 / 电流</text>
<text x="1058.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">独立通道选择与波形显示</text>
</g>
<g data-node="5"><rect x="470" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="640.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">05 · 校准配置管理</text>
<text x="640.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">保存 / 加载 .cal 文件</text>
<text x="640.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">每通道独立零点偏移</text>
</g>
<g data-node="6"><rect x="52" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="222.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">06 · 缓存与 CSV 保存</text>
<text x="222.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">17 列：时间 + 8 组 V / I</text>
<text x="222.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">实时存盘 / 手动导出</text>
</g>
<g data-edge="1-2"><polyline points="400,205 451.0,205.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="462,205 451,200 451,210" fill="#526782"/></g>
<g data-edge="2-3"><polyline points="818,205 869.0,205.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="880,205 869,200 869,210" fill="#526782"/></g>
<g data-edge="3-4"><polyline points="1058,273 1058.0,361.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1058,372 1053,361 1063,361" fill="#526782"/></g>
<g data-edge="4-5"><polyline points="880,440 829.0,440.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="818,440 829,435 829,445" fill="#526782"/></g>
<g data-edge="5-6"><polyline points="462,440 411.0,440.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="400,440 411,435 411,445" fill="#526782"/></g>
<path d="M52 561 H1228" fill="none" stroke="#d6e0ed"/>
<text x="52" y="589" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">与六路位移版协议不同：当前电流帧没有 CRC 字段，不混用解析器。</text>
<text x="52" y="618" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">名义灵敏度来自程序配置；测量准确度应由实际传感器与校准结果确定。</text>
</svg>