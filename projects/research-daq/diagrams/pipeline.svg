<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600"><rect width="1120" height="600" fill="#f5f8fc"/><text x="48" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" text-anchor="start" fill="#18324e" font-weight="700">六路位移 / 电压采集 · 数据链</text><text x="48" y="82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">F407 / AD7606 协议 v1：采样时钟、帧校验与会话文件分层处理</text><rect x="48" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="200.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">采集板数据</text><text x="200.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">6 × int16 原始码</text><text x="200.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">协议约定 10,000 帧 / 秒</text><rect x="408" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="560.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">USB CDC 接收</text><text x="560.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">独立串口线程</text><text x="560.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">最多 200 帧 / 批 或 20 ms</text><rect x="768" y="135" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="920.0" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">32 字节帧解析</text><text x="920.0" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">同步头 / 序号 / MCU 时间戳</text><text x="920.0" y="226" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">CRC-16 校验与失步重同步</text><rect x="768" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="920.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">缓存与波形预览</text><text x="920.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">样本索引生成时间轴</text><text x="920.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">原始码 → 电压 V</text><rect x="408" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="560.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">后台写盘队列</text><text x="560.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">采集与写盘解耦</text><text x="560.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">错误计数 / 原始字节留存</text><rect x="48" y="335" width="304" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="200.0" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">会话文件</text><text x="200.0" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">CSV + RAW + metadata</text><text x="200.0" y="426" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">通过完整性条件后转正式文件</text><polyline points="352,190 403,190" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="403,190 393,185 393,195" fill="#526782"/><polyline points="712,190 763,190" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="763,190 753,185 753,195" fill="#526782"/><polyline points="920,245 920,330" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="920,330 915,320 925,320" fill="#526782"/><polyline points="768,390 717,390" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="717,390 727,385 727,395" fill="#526782"/><polyline points="408,390 357,390" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="357,390 367,385 367,395" fill="#526782"/><text x="48" y="510" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">电压换算：V = raw × 5 / 32768；位移需要传感器零点、方向及 mm/V 标定。</text><text x="48" y="541" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">显示刷新与数据保存分离；协议目标采样率不是本轮实测吞吐率。</text></svg>