<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-label="Mark3 六路位移 / 电压采集 · 数据链">
<rect width="1280" height="690" fill="#f5f8fc"/>
<text x="52" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" text-anchor="start" fill="#18324e" font-weight="700">Mark3 六路位移 / 电压采集 · 数据链</text>
<text x="52" y="88" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">F407 / AD7606 协议 v1：采样时钟、帧校验与会话文件分层处理</text>
<g data-node="1"><rect x="52" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="222.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">01 · 采集板数据</text>
<text x="222.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">6 × int16 原始码</text>
<text x="222.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">协议约定 10,000 帧 / 秒</text>
</g>
<g data-node="2"><rect x="470" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="640.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">02 · USB CDC 接收</text>
<text x="640.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">独立串口线程</text>
<text x="640.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">最多 200 帧 / 批 或 20 ms</text>
</g>
<g data-node="3"><rect x="888" y="145" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1058.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">03 · 32 字节帧解析</text>
<text x="1058.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">同步头 / 序号 / MCU 时间戳</text>
<text x="1058.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">CRC-16 校验与失步重同步</text>
</g>
<g data-node="4"><rect x="888" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1058.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">04 · 缓存与波形预览</text>
<text x="1058.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">样本索引生成时间轴</text>
<text x="1058.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">原始码 → 电压 V</text>
</g>
<g data-node="5"><rect x="470" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="640.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">05 · 后台写盘队列</text>
<text x="640.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">采集与写盘解耦</text>
<text x="640.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">错误计数 / 原始字节留存</text>
</g>
<g data-node="6"><rect x="52" y="380" width="340" height="120" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="222.0" y="415" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">06 · 会话文件</text>
<text x="222.0" y="445" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">CSV + RAW + metadata</text>
<text x="222.0" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">满足完整性条件后转正式文件</text>
</g>
<g data-edge="1-2"><polyline points="400,205 451.0,205.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="462,205 451,200 451,210" fill="#526782"/></g>
<g data-edge="2-3"><polyline points="818,205 869.0,205.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="880,205 869,200 869,210" fill="#526782"/></g>
<g data-edge="3-4"><polyline points="1058,273 1058.0,361.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1058,372 1053,361 1063,361" fill="#526782"/></g>
<g data-edge="4-5"><polyline points="880,440 829.0,440.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="818,440 829,435 829,445" fill="#526782"/></g>
<g data-edge="5-6"><polyline points="462,440 411.0,440.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="400,440 411,435 411,445" fill="#526782"/></g>
<path d="M52 561 H1228" fill="none" stroke="#d6e0ed"/>
<text x="52" y="589" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">电压换算：V = raw × 5 / 32768；位移需要传感器零点、方向及 mm/V 标定。</text>
<text x="52" y="618" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">显示刷新与数据保存分离；协议目标采样率不是本轮实测吞吐率。</text>
</svg>