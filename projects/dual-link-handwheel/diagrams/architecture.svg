<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600"><rect width="1320" height="600" fill="#f5f8fc"/><text x="48" y="48" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" text-anchor="start" fill="#18324e" font-weight="700">双链路手轮 · 相同输入，不同传输</text><text x="48" y="82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">EC11 编码器 + 三按键 + OLED；固件只上报输入事件，不直接产生机器输出。</text><rect x="48" y="230" width="232" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="164.0" y="264" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">人机输入</text><text x="164.0" y="295" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">旋转 / 轴选择 / 步距</text><text x="164.0" y="321" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">X / Y / Z；五档增量</text><rect x="335" y="230" width="260" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="465.0" y="264" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">STM32F103</text><text x="465.0" y="295" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">Gray 合法序列解码</text><text x="465.0" y="321" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">25 ms 按键消抖</text><rect x="665" y="125" width="265" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="797.5" y="159" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">有线 USB 版本</text><text x="797.5" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">原生 USB CDC</text><text x="797.5" y="216" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连接器形式与协议分开</text><rect x="665" y="355" width="265" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="797.5" y="389" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">Wi-Fi 版本</text><text x="797.5" y="420" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">UART → ESP-01S → TCP</text><text x="797.5" y="446" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">COBS + CRC16 + SESSION</text><rect x="1010" y="230" width="260" height="110" rx="12" fill="white" stroke="#a8bad1" stroke-width="2"/><text x="1140.0" y="264" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle" fill="#18324e" font-weight="700">PC HMI</text><text x="1140.0" y="295" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">握手 / 授权 / 去重</text><text x="1140.0" y="321" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">联锁通过后才接受点动</text><polyline points="280,285 330,285" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="330,285 320,280 320,290" fill="#526782"/><polyline points="595,265 625,265 625,180 660,180" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="660,180 650,175 650,185" fill="#526782"/><polyline points="595,305 625,305 625,410 660,410" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="660,410 650,405 650,415" fill="#526782"/><polyline points="930,180 970,180 970,265 1005,265" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="1005,265 995,260 995,270" fill="#526782"/><polyline points="930,410 970,410 970,305 1005,305" fill="none" stroke="#526782" stroke-width="2.5"/><polygon points="1005,305 995,300 995,310" fill="#526782"/><text x="48" y="520" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" text-anchor="start" fill="#18324e" font-weight="400">共享授权链：HELLO → STATUS / HEALTH → ARM(token) → ARMED(token, baseline) → EVENT</text><text x="48" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">500 ms 心跳 / 1500 ms 超时撤权；断线、重连或故障清空旧事件，防止跨会话重放。</text></svg>