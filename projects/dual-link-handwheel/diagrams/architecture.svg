<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="810" viewBox="0 0 1340 810" role="img" aria-label="双链路手轮 · 相同输入，不同传输">
<rect width="1340" height="810" fill="#f5f8fc"/>
<text x="52" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" text-anchor="start" fill="#18324e" font-weight="700">双链路手轮 · 相同输入，不同传输</text>
<text x="52" y="88" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">EC11 编码器 + 三按键 + OLED；固件只上报输入事件，不直接产生机器输出</text>
<g data-node="input"><rect x="44" y="294" width="230" height="128" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="159.0" y="329" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">人机输入</text>
<text x="159.0" y="359" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">旋转 / 轴选择 / 步距</text>
<text x="159.0" y="386" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">X / Y / Z；五档增量</text>
</g>
<g data-node="mcu"><rect x="360" y="294" width="250" height="128" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="485.0" y="329" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">STM32F103</text>
<text x="485.0" y="359" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">Gray 合法序列解码</text>
<text x="485.0" y="386" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">25 ms 按键消抖</text>
</g>
<g data-node="usb"><rect x="720" y="145" width="270" height="128" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="855.0" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">有线 USB 版本</text>
<text x="855.0" y="210" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">原生 USB CDC</text>
<text x="855.0" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">连接器形式与协议分开</text>
</g>
<g data-node="wifi"><rect x="720" y="445" width="270" height="128" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="855.0" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">Wi-Fi 版本</text>
<text x="855.0" y="510" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">UART → ESP-01S → TCP</text>
<text x="855.0" y="537" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">COBS + CRC16 + SESSION</text>
</g>
<g data-node="pc"><rect x="1080" y="294" width="220" height="128" rx="12" fill="white" stroke="#a8bad1" stroke-width="1.8"/>
<text x="1190.0" y="329" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle" fill="#18324e" font-weight="700">PC HMI</text>
<text x="1190.0" y="359" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">握手 / 授权 / 去重</text>
<text x="1190.0" y="386" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#526782" font-weight="400">联锁通过后接受点动</text>
</g>
<g data-edge="input-mcu"><polyline points="282,358 341.0,358.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="352,358 341,353 341,363" fill="#526782"/></g>
<g data-edge="mcu-usb"><polyline points="618,326 665,326 665,209 701.0,209.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="712,209 701,204 701,214" fill="#526782"/></g>
<g data-edge="mcu-wifi"><polyline points="618,390 665,390 665,509 701.0,509.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="712,509 701,504 701,514" fill="#526782"/></g>
<g data-edge="usb-pc"><polyline points="998,209 1035,209 1035,326 1061.0,326.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1072,326 1061,321 1061,331" fill="#526782"/></g>
<g data-edge="wifi-pc"><polyline points="998,509 1035,509 1035,390 1061.0,390.0" fill="none" stroke="#526782" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1072,390 1061,385 1061,395" fill="#526782"/></g>
<path d="M52 627 H1288" fill="none" stroke="#d6e0ed"/>
<text x="52" y="655" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">共享授权链：HELLO → STATUS / HEALTH → ARM(token)</text>
<text x="52" y="684" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">收到 ARMED(token, baseline) 后接收 EVENT；500 ms 心跳 / 1500 ms 超时撤权。</text>
<text x="52" y="713" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="start" fill="#526782" font-weight="400">断线、重连或故障清空旧事件，防止跨会话重放。</text>
</svg>